# 慢慢说 · 对外的统一入口（宿主 Nginx，由宝塔面板管理）
#
# 为什么放在宿主 Nginx 而不是容器里：
#   这台机器上早就跑着宝塔的 Nginx（占 80/8080/888），再加一个 Nginx 容器
#   纯属重复建设。复用现成的即可。
#
# 与后端的分工：
#   /app/       宣传页  —— Nginx 直接发静态文件，不经 Python 进程
#   /download/  安装包  —— 同上
#   /           其余一切（/api /uploads /docs …）反代到 127.0.0.1:8000
#
# 后端 8000 端口继续保留不动，因此 **App 的 BASE_URL 不用改、不必重新出包**。
#
# 安装位置：/www/server/panel/vhost/nginx/couple-app.conf
# （主配置 nginx.conf:102 有 `include /www/server/panel/vhost/nginx/*.conf;`）
# 安装脚本：deploy/apply_nginx_site.py

server {
    listen 80;
    server_name 182.92.194.78;

    # 直接访问 IP 时引导到宣传页，别给一个裸 404
    location = / {
        return 302 /app/;
    }

    # ── 宣传页 ──────────────────────────────────────────────────────────
    # 指向部署解包后的目录。该路径每次部署都会被覆盖成最新内容，
    # 所以改文案只需重跑 deploy_pack + 上传解包，**不需要重建镜像**。
    # 注意：目录属主是 root、权限 755/644，Nginx worker 以 www 运行，
    # 靠的是"其他用户可读"，因此不要把这些文件改成 600。
    location /app/ {
        alias /usr/src/couple-deploy/backend/static/app/;
        index index.html;
        # 页面会随部署更新，缓存给短一点，避免改完看不到
        add_header Cache-Control "public, max-age=300";
    }

    location = /app {
        return 301 /app/;
    }

    # ── 安装包 ─────────────────────────────────────────────────────────
    # 宿主 bind mount 目录，换包只需替换文件，不重建、不重新部署。
    location /download/ {
        alias /usr/src/couple-deploy/apk/;
        autoindex off;
        # 带版本号的文件名不会变内容，可以缓存久一点
        add_header Cache-Control "public, max-age=3600";
        # 直接点直链时也走下载而不是在浏览器里打开二进制
        add_header Content-Disposition "attachment";
        types {
            application/vnd.android.package-archive apk;
        }
        default_type application/vnd.android.package-archive;
    }

    # ── 其余一律反代给后端 ──────────────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ⚠️ 这两行是流式（SSE）的生死线：
        #    默认 Nginx 会把上游响应缓冲起来，AI 的 event:delta 会被攒到
        #    最后一次性吐出，前端看到的就变成"转圈很久然后整段蹦出来"。
        proxy_buffering off;
        proxy_cache off;
        # 长回答要几分钟，默认 60s 会中途断流
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    access_log /www/wwwlogs/couple-app.log;
    error_log  /www/wwwlogs/couple-app.error.log;
}
