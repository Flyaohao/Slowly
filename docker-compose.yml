# 一键起 后端 + （可选）MySQL + 向量库卷
#
# 为什么需要容器：线上服务器是 Python 3.8，
# 而 AI 链路依赖的 langchain 1.x / chromadb 都要求 >= 3.9。
# 容器把 Python 版本这一层隔离掉，不必动服务器系统环境。
#
# ── 用法 ────────────────────────────────────────────────────────────
# 在仓库根目录创建 .env（compose 会自动读取，已被 gitignore）：
#     JWT_SECRET=...
#     AI_API_KEY=...                 # 阿里云百炼 DashScope 的 key
#     DB_URL=mysql+pymysql://root:<密码>@host.docker.internal:3306/couple_translator?charset=utf8mb4
#
# 【生产：沿用宿主机已有的 MySQL】—— 推荐，不会丢数据
#     docker compose up -d --build
#
# 【本地/全新环境：用内置 MySQL】
#     # .env 里不要设 DB_URL，另需 MYSQL_ROOT_PASSWORD
#     docker compose --profile local-db up -d --build
#
# 首次启动会自动跑 alembic 迁移、灌种子数据、构建向量库
# （顺序与幂等性见 backend/docker-entrypoint.sh）。

name: couple-translator

services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      # 配了 DB_URL 就用外部库；没配则用下面 local-db 起的内置库
      DB_URL: ${DB_URL:-mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-root}@db:3306/${MYSQL_DATABASE:-couple_translator}?charset=utf8mb4}
      DB_CHARSET: utf8mb4
      JWT_SECRET: ${JWT_SECRET:?请在仓库根目录的 .env 里设置 JWT_SECRET}
      AI_API_KEY: ${AI_API_KEY:?请在仓库根目录的 .env 里设置 AI_API_KEY}
      AI_MODEL: ${AI_MODEL:-qwen-plus}
      # 记忆抽取等后台轻量任务专用。config 里的兜底值也是 qwen-turbo，
      # 这里显式转发是为了让 .env 里设的值真的生效（否则设了也不起作用）。
      AI_MEMORY_MODEL: ${AI_MEMORY_MODEL:-qwen-turbo}
      AI_BASE_URL: ${AI_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      # 推理模型的思考预算（token）。主模型是推理模型，先写思考再落笔正文，
      # 思考长度直接等于用户等待：实测同一封信不限时首字正文 32.9s，
      # 压到 1024 时 13.4s。0 = 不限制。
      AI_THINKING_BUDGET: ${AI_THINKING_BUDGET:-1024}
      # 置 false 则连思考都不产生，首字约 0.9s（前端「深度思考」面板会空着）
      AI_ENABLE_THINKING: ${AI_ENABLE_THINKING:-true}
      # 指向挂载卷，重建镜像不会丢向量
      CHROMA_DIR: /app/data/chroma
      # 空库首次启动时灌种子数据（脚本幂等，重复执行安全）
      SEED_ON_START: ${SEED_ON_START:-1}
      # 邮件（忘记密码验证码）。compose 的 environment 是白名单转发，
      # .env 里的值必须在这里列出才会真正进容器（同 AI_MEMORY_MODEL 的坑）
      SMTP_HOST: ${SMTP_HOST:-smtp.qq.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_AUTH_CODE: ${SMTP_AUTH_CODE:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_DEV_MODE: ${EMAIL_DEV_MODE:-false}
      # AI 端点按用户限流（slowapi 语法，0 或空关闭）。默认 20/hour
      AI_RATE_LIMIT: ${AI_RATE_LIMIT:-20/hour}
      # AI 端点的 IP 维度兜底限流。上面那条的限流键是 user_id，
      # 批量注册后每个账号各享一份配额，这条按 IP 记总量把它们兜住
      AI_IP_RATE_LIMIT: ${AI_IP_RATE_LIMIT:-120/hour}
      # 接口文档保护口令（/docs /redoc /openapi.json）。
      # 两者任一为空则一律返回 401 —— 不再对外敞开，避免泄露全部接口结构
      DOCS_USER: ${DOCS_USER:-}
      DOCS_PASS: ${DOCS_PASS:-}
      # 允许跨站访问的来源，逗号分隔。默认空 = 不允许任何跨站来源。
      # App 走 Retrofit 不受 CORS 约束（那是浏览器机制），留空不影响客户端
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # 军师 AI 记忆系统 v3.2 feature flags（契约附录 §6.2）。
      # 全 0 = 行为与 v1 完全一致；白名单转发，.env 设了不列这里不生效
      MEMORY_ASSERTION_DUAL_WRITE: ${MEMORY_ASSERTION_DUAL_WRITE:-0}
      MEMORY_ASSERTION_READ_V3: ${MEMORY_ASSERTION_READ_V3:-0}
      MEMORY_ASSERTION_REQUIRE_COMPLETE: ${MEMORY_ASSERTION_REQUIRE_COMPLETE:-0}
      MEMORY_ASSERTION_INDEX_WORKER: ${MEMORY_ASSERTION_INDEX_WORKER:-0}
    extra_hosts:
      # 让容器内的 host.docker.internal 指向宿主机，
      # 这样 DB_URL 可以直接连宿主机上原有的 MySQL
      - "host.docker.internal:host-gateway"
    volumes:
      - chroma_data:/app/data/chroma
      # 上传的图片（头像 / 纪念馆藏品配图）放挂载卷，重建镜像不丢
      - uploads_data:/app/uploads
      # 安卓安装包目录：刻意用宿主 bind mount 而不是命名卷，
      # 这样换包只需往宿主 ./apk 里丢新文件（或 scp 上去），
      # 既不用重建镜像，20MB 的 APK 也不会被打进部署包与镜像层。
      - ./apk:/app/static/apk
      # 宣传页同样走宿主目录：宿主 Nginx 直接发这两个目录的静态文件，
      # 容器这边挂同一份，两个入口（80 与 8000）读到的内容永远一致。
      # 于是改文案 = 重跑构建脚本 + 重新解包，**不必重建镜像**。
      - ./backend/static/app:/app/static/app
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  tasks-scheduler:
    # 后台定时任务常驻进程（当前只有解绑冷静期超时检查，每天 02:00）。
    # 与 backend 共用同一镜像，不监听端口；用 schedule 库自循环，无新依赖。
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DB_URL: ${DB_URL:-mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-root}@db:3306/${MYSQL_DATABASE:-couple_translator}?charset=utf8mb4}
      DB_CHARSET: utf8mb4
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # 必须覆盖 entrypoint 而不是 command：镜像的 ENTRYPOINT 是 docker-entrypoint.sh，
    # 它会无视传入的 CMD 参数强行起 uvicorn（部署时实测踩中，scheduler 变成了空转的 uvicorn）
    entrypoint: ["python", "-m", "app.tasks.unbinding_timeout"]
    depends_on:
      - backend

  ai-task-worker:
    # 可靠后台任务执行者（调解改写/重生成/总结）。
    # 为什么必须独立于 backend：这些生成是分钟级 LLM 调用，跑在请求进程里
    # 会随容器发布/重启一起丢失，会话就永久停在「生成中」。任务先落库
    # （ai_task 表），本进程负责领取与执行；它挂了重启后会回收超时任务。
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DB_URL: ${DB_URL:-mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-root}@db:3306/${MYSQL_DATABASE:-couple_translator}?charset=utf8mb4}
      DB_CHARSET: utf8mb4
      # 与 backend 同源，否则 worker 调模型时用的是另一套配置
      AI_API_KEY: ${AI_API_KEY:?请在仓库根目录的 .env 里设置 AI_API_KEY}
      AI_MODEL: ${AI_MODEL:-qwen-plus}
      AI_MEMORY_MODEL: ${AI_MEMORY_MODEL:-qwen-turbo}
      AI_BASE_URL: ${AI_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      AI_THINKING_BUDGET: ${AI_THINKING_BUDGET:-1024}
      AI_ENABLE_THINKING: ${AI_ENABLE_THINKING:-true}
      CHROMA_DIR: /app/data/chroma
      AI_TASK_IDLE_INTERVAL: ${AI_TASK_IDLE_INTERVAL:-3}
    volumes:
      - chroma_data:/app/data/chroma
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # 必须覆盖 entrypoint 而不是 command：镜像的 ENTRYPOINT 是 docker-entrypoint.sh，
    # 它会无视传入的 CMD 参数强行起 uvicorn（部署时实测踩中，scheduler 变成了空转的 uvicorn）
    entrypoint: ["python", "-m", "app.tasks.ai_task_worker"]
    depends_on:
      - backend

  db:
    # 只在显式启用 local-db profile 时启动，避免和宿主机已有 MySQL 抢 3306
    profiles: ["local-db"]
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      # 这里刻意不用 ${MYSQL_ROOT_PASSWORD:?...}：
      # compose 的变量插值是全局的，即使 local-db profile 没启用，带 :? 的变量
      # 缺失也会让 `docker compose up` 直接失败——于是「沿用宿主机 MySQL」这条
      # 推荐路径反而必须先填一个用不到的密码。
      # 留空交给 mysql 镜像自己校验：它发现既没有 MYSQL_ROOT_PASSWORD、
      # 也没有 MYSQL_ALLOW_EMPTY_PASSWORD 时会明确报错退出，
      # 所以「启用 local-db 就必须给密码」这个约束依然成立，只是换了执行者。
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-couple_translator}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    ports:
      # 默认映射到宿主 3307，避开宿主机自带的 MySQL
      - "${MYSQL_HOST_PORT:-3307}:3306"

volumes:
  mysql_data:
  chroma_data:
  uploads_data:
